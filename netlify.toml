[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  included_files = ["lib/**"]

[[redirects]]
  from = "/api/fish/tts"
  to = "/.netlify/functions/fish-tts"
  status = 200
  force = true

[[redirects]]
  from = "/api/guide/chat"
  to = "/.netlify/functions/guide-chat"
  status = 200
  force = true

[[redirects]]
  from = "/build"
  to = "/configure/"
  status = 301
  force = true

[[redirects]]
  from = "/build/"
  to = "/configure/"
  status = 301
  force = true

[[redirects]]
  from = "/security.html"
  to = "/security"
  status = 301
  force = true

[[redirects]]
  from = "/aria-enterprise-page"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/aria-enterprise-page/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/aria-enterprise-page/*"
  to = "/:splat"
  status = 301
  force = true

# Do not publish internal notes, backups, scripts, library source, or function
# source. Rules are force-404 so they win over files in the publish root.
# /.netlify/functions/* is the invoke path and is not matched here.
# /api/fish/tts and /api/guide/chat stay above, so the two functions still run.

[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*/*.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*/*/*.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.bak"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*/*.bak"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*/*/*.bak"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.py"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*/*.py"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.pyc"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*/*.pyc"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/__pycache__/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*/__pycache__/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/lib/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/lib/*/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/email-sequences/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# Aria does not offer outbound calling. Keep old URLs from 404ing.
[[redirects]]
  from = "/outbound-calling"
  to = "/platform"
  status = 301
  force = true

[[redirects]]
  from = "/outbound-calling/"
  to = "/platform"
  status = 301
  force = true

[[redirects]]
  from = "/outbound-calling.html"
  to = "/platform"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(self), payment=(), usb=(), interest-cohort=()"
    X-Frame-Options = "SAMEORIGIN"
