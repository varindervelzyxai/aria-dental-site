[build]
  publish = "publish"
  command = "node scripts/stage-public-site.mjs"
  functions = "netlify/functions"

[functions]
  included_files = ["lib/**"]

[[redirects]]
  from = "/api/fish/tts"
  to = "/.netlify/functions/fish-tts"
  status = 200
  force = true

[[redirects]]
  from = "/api/guide/chat"
  to = "/.netlify/functions/guide-chat"
  status = 200
  force = true

[[redirects]]
  from = "/build"
  to = "/configure/"
  status = 301
  force = true

[[redirects]]
  from = "/build/"
  to = "/configure/"
  status = 301
  force = true

[[redirects]]
  from = "/security.html"
  to = "/security"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/aria-enterprise-page"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/aria-enterprise-page/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/aria-enterprise-page/*"
  to = "/:splat"
  status = 301
  force = true

# Backstop only. The publish directory is the real file protection: internal
# notes, scripts, library source, and function source are not copied into it.
# These rules use path segments Netlify splats can match. Extension wildcards
# such as /*.md do not match file extensions and are not used.
# /.netlify/functions/* is the invoke path and is not matched here.
# /api/fish/tts and /api/guide/chat stay above, so the two functions still run.

[[redirects]]
  from = "/__pycache__/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*/__pycache__/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/lib/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/lib/*/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/email-sequences/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_ACTION_PLAN.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_AGENT_CHANGES.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/REMAINING_TODOS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/FAVICONS_TODO.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_AUDIT.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/aria-enterprise-page/_AGENT_CHANGES.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/aria-insurance-demo/_AGENT_CHANGES.md"
  to = "/404.html"
  status = 404
  force = true

# Aria does not offer outbound calling. Keep old URLs from 404ing.
[[redirects]]
  from = "/outbound-calling"
  to = "/platform"
  status = 301
  force = true

[[redirects]]
  from = "/outbound-calling/"
  to = "/platform"
  status = 301
  force = true

[[redirects]]
  from = "/outbound-calling.html"
  to = "/platform"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(self), payment=(), usb=(), interest-cohort=()"
    X-Frame-Options = "SAMEORIGIN"
